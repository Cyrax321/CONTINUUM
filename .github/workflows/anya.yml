name: anya

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  anya:
    if: |
      github.event.comment.user.type == 'User' &&
      (startsWith(github.event.comment.body, '/anya') ||
      contains(github.event.comment.body, ' /anya')) &&
      !contains(github.event.comment.body, '/anya review')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run Anya
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.ANYA_TOKEN }}
        with:
          model: opencode/muse-spark-1.3-contributor-free
          use_github_token: true
          mentions: "/anya"
          share: false
          prompt: |
            You are Anya, a maintainer of CONTINUUM. Answer the request directly
            and briefly, in the same human maintainer voice as code reviews.
            When asked whether a PR can merge or why auto-merge is stuck,
            report each gate with specifics from the repo: approving reviews
            present or missing (and that new pushes dismiss prior approvals),
            required check conclusions by name, unresolved review threads by
            author and file, merge conflicts by file, and auto-merge state.
            Never use em dashes or en dashes (banned codepoints U+2014 and
            U+2013). Never use emojis.
