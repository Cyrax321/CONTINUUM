name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# NOTE: docs-only PRs must still report every required check. Workflow-level
# paths-ignore was tried and reverted: a fully filtered workflow posts no
# statuses at all, so required checks pend forever as Expected. Instead the
# detect job below computes docs-only and each heavy job skips itself with
# an if condition, which GitHub reports as skipped and the merge gate
# accepts.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect docs-only change
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.check.outputs.docs-only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- . ':!*.md'; then
            echo "docs-only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: detect
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      # Docs-only short-circuit: the job must still report a conclusion so
      # required per-version contexts do not pend forever (a fully skipped
      # matrix posts no check runs at all). Heavy steps stand down instead.
      - name: Set up Python ${{ matrix.python-version }}
        if: needs.detect.outputs.docs-only != 'true'
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev dependencies
        if: needs.detect.outputs.docs-only != 'true'
        run: pip install -e ".[dev]"

      # Issue #281: the PowerShell launcher must work from a fresh clone,
      # which on this runner means no .venv. uv is present on GitHub
      # runners, so this exercises the uv venv + uv pip install bootstrap
      # path; the python -m venv + pip fallback is covered by the static
      # contract test in tests/test_tryit_launchers.py.
      - name: Try-it launcher bootstraps from a fresh clone (Windows)
        if: needs.detect.outputs.docs-only != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path .venv) { Remove-Item -Recurse -Force .venv }
          powershell -ExecutionPolicy Bypass -File .\try-it.ps1 cli --help

      - name: Run tests with coverage
        if: needs.detect.outputs.docs-only != 'true'
        run: pytest --tb=short -q --cov=continuum --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: codecov/codecov-action@v7.0.0
        if: matrix.python-version == '3.12' && runner.os == 'Linux'
        with:
          files: coverage.xml
          fail_ci_if_error: false

  test-postgres:
    name: Test (Postgres backend)
    needs: detect
    if: needs.detect.outputs.docs-only != 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: continuum
          POSTGRES_PASSWORD: continuum
          POSTGRES_DB: continuum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U continuum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install with Postgres extra
        run: pip install -e ".[dev,postgres]"

      - name: Run Postgres contract tests
        env:
          CONTINUUM_TEST_POSTGRES_DSN: postgresql://continuum:continuum@localhost:5432/continuum_test
        run: pytest tests/test_storage_postgres.py tests/test_action_index.py --tb=short -q

  lint:
    name: Lint & Type-check
    needs: detect
    if: needs.detect.outputs.docs-only != 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff - lint
        run: ruff check src/ tests/ examples/ _bugaudit/

      - name: Ruff - format check
        run: ruff format --check src/ tests/ examples/ _bugaudit/

      - name: mypy, strict type-check
        run: mypy src/continuum

  # Issue #279: wheels were built only on release tags, so nobody could install
  # current main without cloning. Every push to main now produces a wheel and
  # sdist artifact, smoke-tested into a clean venv before upload.
  # Follow-up #837 tracks the remaining gaps: non-editable installs only on
  # ubuntu, POSIX-only temp paths, and no console-script handshake.
  build-wheel:
    if: github.repository == 'Cyrax321/CONTINUUM' && needs.detect.outputs.docs-only != 'true'
    needs: detect
    name: Build wheel artifact
    runs-on: ubuntu-latest

    steps:
      # persist-credentials: false keeps the GITHUB_TOKEN out of the local git
      # config; nothing in this job talks to git after checkout.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install uv
        run: python -m pip install uv

      - name: Build wheel and sdist
        run: uv build

      - name: Smoke-test the wheel in a clean venv
        run: |
          python -m venv "$RUNNER_TEMP/wheel-check"
          if [ -f "$RUNNER_TEMP/wheel-check/bin/pip" ]; then BIN="$RUNNER_TEMP/wheel-check/bin"; else BIN="$RUNNER_TEMP/wheel-check/Scripts"; fi
          WHEEL=$(ls dist/*.whl | head -1 | tr -d '\r')
          "$BIN/pip" install --quiet "$WHEEL[mcp]"
          "$BIN/continuum" --version
          "$BIN/continuum-mcp" --help

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-main
          path: dist/

  install-matrix:
    name: Install (non-editable, ${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: build-wheel
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: dist-main
          path: dist/
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install wheel non-editable with mcp extra
        shell: bash
        run: |
          WHEEL=$(ls dist/*.whl | head -1)
          python -m pip install "$WHEEL[mcp]"
      - name: Verify console scripts resolve via PATH
        run: |
          continuum --version
          continuum-mcp --help
      - name: Stdio handshake over installed console script
        run: python scripts/mcp_smoke.py --entry-point console-script
