name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest --tb=short -q --cov=continuum --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: codecov/codecov-action@v7.0.0
        if: matrix.python-version == '3.12' && runner.os == 'Linux'
        with:
          files: coverage.xml
          fail_ci_if_error: false

  test-postgres:
    name: Test (Postgres backend)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: continuum
          POSTGRES_PASSWORD: continuum
          POSTGRES_DB: continuum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U continuum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install with Postgres extra
        run: pip install -e ".[dev,postgres]"

      - name: Run Postgres contract tests
        env:
          CONTINUUM_TEST_POSTGRES_DSN: postgresql://continuum:continuum@localhost:5432/continuum_test
        run: pytest tests/test_storage_postgres.py tests/test_action_index.py --tb=short -q

  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff - lint
        run: ruff check src/ tests/ examples/

      - name: Ruff - format check
        run: ruff format --check src/ tests/ examples/

      - name: mypy, strict type-check
        run: mypy src/continuum

  # Issue #279: wheels were built only on release tags, so nobody could install
  # current main without cloning. Every push to main now produces a wheel and
  # sdist artifact, smoke-tested into a clean venv before upload.
  build-wheel:
    if: github.repository == 'Cyrax321/CONTINUUM' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Build wheel artifact
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install uv
        run: python -m pip install uv

      - name: Build wheel and sdist
        run: uv build

      - name: Smoke-test the wheel in a clean venv
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install --quiet dist/*.whl
          /tmp/wheel-check/bin/continuum --version

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist-main
          path: dist/
