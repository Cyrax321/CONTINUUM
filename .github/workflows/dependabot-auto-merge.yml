name: Dependabot Auto Merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]' && github.repository == github.event.repository.full_name
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Approve and enable auto-merge
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number: prNumber,
            });
            const alreadyApproved = reviews.some((r) => r.user.login === "github-actions[bot]" && r.state === "APPROVED");
            if (!alreadyApproved) {
              await github.rest.pulls.createReview({
                owner,
                repo,
                pull_number: prNumber,
                event: "APPROVE",
                body: "Dependabot dependency bump approved automatically. Merging once all required checks pass.",
              });
              console.log(`Approved Dependabot PR #${prNumber}`);
            }

            try {
              await github.rest.pulls.enableAutoMerge({
                owner,
                repo,
                pull_number: prNumber,
                merge_method: "squash",
              });
              console.log(`Auto-merge enabled for PR #${prNumber}`);
            } catch (error) {
              console.log(`Could not enable auto-merge on #${prNumber}: ${error.message}`);
            }
