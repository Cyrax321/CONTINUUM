name: Welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Check if first contribution
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const login = context.payload.sender.login;
            const currentNumber = context.issue.number;
            const isIssueEvent = !!context.payload.issue && !context.payload.pull_request;
            // Check prior issues by this user
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              creator: login,
              state: 'all',
              per_page: 100
            });
            const priorIssues = issues.filter(i => !i.pull_request && i.number < currentNumber);
            const isFirstIssue = priorIssues.length === 0;
            // Check prior PRs by this user, correctly filtered by creator
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });
            const priorPRs = pulls.filter(p => p.user && p.user.login === login && p.number < currentNumber);
            const isFirstPR = priorPRs.length === 0;
            // For each event type only consider the relevant history
            const shouldWelcome = isIssueEvent ? isFirstIssue : isFirstPR;
            core.setOutput('should_welcome', shouldWelcome ? 'true' : 'false');
            console.log(`Welcome check for ${login}: isFirstIssue=${isFirstIssue} isFirstPR=${isFirstPR} shouldWelcome=${shouldWelcome}`);
      - uses: actions/first-interaction@v3
        if: steps.check.outputs.should_welcome == 'true'
        with:
          # v3 of the action reads snake_case inputs; the older hyphenated
          # names are rejected as unexpected and issue_message then fails
          # its "input required" check.
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: |
            Thanks for opening your first issue in CONTINUUM.

            Taking the time to write up a problem you found is a real
            contribution, and reports like this are how the project improves.
            If you can add reproduction steps and your Python version, that
            helps a maintainer dig in faster. Someone will take a look soon,
            so keep an eye on this thread.
          pr_message: |
            Thanks for your first pull request to CONTINUUM.

            Getting a change from idea to open PR is the hard part, and you
            have already done it. CI will run automatically. Please make sure
            it passes and that your PR title follows conventional commits
            (for example `feat:` or `fix:`). A maintainer will review it soon.

            Review feedback is normal and expected, so do not worry about
            getting everything perfect on the first try. Thanks again for
            contributing.
