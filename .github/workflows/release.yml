name: Release to PyPI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write   # to create GitHub Release
  id-token: write   # for trusted OIDC publishing

jobs:
  build:
    if: github.repository == 'Cyrax321/CONTINUUM'
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Run tests before release
        run: uv run --extra dev pytest --tb=short -q

      - name: Build wheel and sdist
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    # Opt-in: set the PUBLISH_PYPI repository variable to "true" once the
    # trusted-publisher environment is configured. Until then releases build
    # wheels, attach them to the GitHub Release, and skip PyPI.
    if: github.repository == 'Cyrax321/CONTINUUM' && vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/project/continuum-agent/
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (trusted publisher)
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          files: dist/*
          generate_release_notes: true
