name: Feature request
description: Propose a change or addition
labels: ["enhancement"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      description: Which part of CONTINUUM would this change touch?
      options:
        - Core (state, checkpoints, recovery)
        - Adapters (LangGraph, OpenAI Agents, LangChain, generic)
        - CLI
        - MCP server
        - Detector / drift detection
        - Benchmarks
        - Documentation
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: >
        Describe the situation that is currently difficult or impossible.
        Proposals grounded in a concrete problem are easier to evaluate than
        proposals grounded in a solution.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you would like to happen.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: >
        Other approaches you looked at, and why they were not sufficient.
        Including a rejected option is often more useful than omitting it.
    validations:
      required: false

  - type: dropdown
    id: breaking
    attributes:
      label: Is this a breaking change?
      options:
        - "No"
        - "Yes"
        - "Not sure"
    validations:
      required: false

  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to work on this?
      description: >
        You do not need to commit to anything by answering yes. A maintainer
        will help you get started.
      options:
        - "No"
        - "Yes, with guidance"
        - "Yes, I have a plan"
    validations:
      required: true
