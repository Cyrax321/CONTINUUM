<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1000" font-family="Inter, 'Segoe UI', system-ui, sans-serif" role="img" aria-label="CONTINUUM how it works">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#071827" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52758B"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF5017"/>
    </marker>
    <style>
      .tier    { fill:#F0F7FC; stroke:#CFE3F2; stroke-width:1.5; }
      .tierSDK { fill:#FFF3EC; stroke:#FFD9C7; stroke-width:1.5; }
      .card    { fill:#FFFFFF; stroke:#E7ECEF; stroke-width:1.5; }
      .cardH   { fill:#FFFFFF; stroke:#FF5017; stroke-width:2; }
      .ovr     { fill:#FFF3EC; stroke:#FF5017; stroke-width:2; }
      .obox    { fill:#FFFFFF; stroke:#FFD9C7; stroke-width:1.5; }
      .ttl     { fill:#071827; font-weight:700; }
      .sub     { fill:#6B7D8D; }
      .sub2    { fill:#9AAAB8; }
      .lbl     { fill:#FF5017; font-weight:700; letter-spacing:1.5px; }
      .sdk     { fill:#071827; font-weight:800; letter-spacing:1px; }
      .edge    { stroke:#52758B; stroke-width:2; fill:none; }
      .edgeO   { stroke:#FF5017; stroke-width:2.5; fill:none; }
      .dash    { stroke:#FF5017; stroke-width:2.5; fill:none; stroke-dasharray:6 5; }
      .elabel  { fill:#52758B; font-size:10px; }
      .elabelO { fill:#FF5017; font-size:10px; font-weight:600; }
    </style>
  </defs>

  <rect x="0" y="0" width="1080" height="1000" fill="#FFFFFF"/>

  <text x="40" y="38" class="lbl" font-size="13">CONTINUUM · HOW IT WORKS</text>

  <!-- ===================== TIER 1: AGENTS & CLIENTS ===================== -->
  <rect class="tier" x="60" y="60" width="960" height="104" rx="16" filter="url(#shadow)"/>
  <text x="80" y="84" class="lbl" font-size="11">AGENTS &amp; CLIENTS</text>

  <rect class="card" x="80"  y="100" width="210" height="52" rx="10"/>
  <text x="96" y="124" class="ttl" font-size="14">Claude Code</text>
  <text x="96" y="144" class="sub" font-size="11">AI coding agent</text>

  <rect class="card" x="310" y="100" width="210" height="52" rx="10"/>
  <text x="326" y="124" class="ttl" font-size="14">LangGraph agent</text>
  <text x="326" y="144" class="sub" font-size="11">graph workflows</text>

  <rect class="card" x="540" y="100" width="210" height="52" rx="10"/>
  <text x="556" y="124" class="ttl" font-size="14">OpenAI agent</text>
  <text x="556" y="144" class="sub" font-size="11">Agents SDK</text>

  <rect class="card" x="770" y="100" width="210" height="52" rx="10"/>
  <text x="786" y="124" class="ttl" font-size="14">Generic Python</text>
  <text x="786" y="144" class="sub" font-size="11">in-process facade</text>

  <path class="edge" d="M540,164 L540,184" marker-end="url(#arrow)"/>

  <!-- ===================== TIER 2: ADAPTERS ===================== -->
  <rect class="tier" x="60" y="184" width="960" height="60" rx="16" filter="url(#shadow)"/>
  <text x="80" y="208" class="lbl" font-size="11">FRAMEWORK ADAPTERS (optional)</text>

  <rect class="card" x="80"  y="212" width="280" height="32" rx="9"/>
  <text x="96"  y="234" class="ttl" font-size="13">LangGraphAdapter</text>

  <rect class="card" x="390" y="212" width="280" height="32" rx="9"/>
  <text x="406" y="234" class="ttl" font-size="13">OpenAIAgentAdapter</text>

  <rect class="card" x="700" y="212" width="280" height="32" rx="9"/>
  <text x="716" y="234" class="ttl" font-size="13">GenericAgentAdapter</text>

  <path class="edge" d="M540,244 L540,268" marker-end="url(#arrow)"/>

  <!-- ===================== TIER 3: CONTINUUM SDK ===================== -->
  <rect class="tierSDK" x="60" y="268" width="960" height="300" rx="16" filter="url(#shadow)"/>
  <text x="80" y="294" class="sdk" font-size="13">CONTINUUM SDK</text>
  <rect x="560" y="278" width="450" height="26" rx="13" fill="#07131E"/>
  <text x="574" y="295" fill="#FFFFFF" font-size="11" font-weight="600">MCP server: deny by default, 9 tools (3 read-only / 6 mutating)</text>

  <!-- Pipeline nodes -->
  <rect class="card"  x="80"  y="330" width="156" height="120" rx="10"/>
  <text x="96"  y="358" class="ttl" font-size="14">Extractors</text>
  <text x="96"  y="380" class="sub" font-size="10">deterministic</text>
  <text x="96"  y="398" class="sub" font-size="10">LLM optional</text>

  <rect class="card"  x="268" y="330" width="156" height="120" rx="10"/>
  <text x="284" y="358" class="ttl" font-size="14">Event Log</text>
  <text x="284" y="380" class="sub" font-size="10">hash-chained</text>
  <text x="284" y="398" class="sub" font-size="10">32 event types</text>
  <text x="284" y="416" class="sub" font-size="10">+ perception events</text>

  <rect class="card"  x="456" y="330" width="156" height="120" rx="10"/>
  <text x="472" y="358" class="ttl" font-size="14">State Engine</text>
  <text x="472" y="378" class="sub" font-size="10">&amp; Checkpoint</text>
  <text x="472" y="396" class="sub" font-size="10">semantic projection</text>
  <text x="472" y="414" class="sub" font-size="10">Environment snapshot</text>

  <rect class="cardH" x="644" y="330" width="156" height="120" rx="10"/>
  <text x="660" y="358" class="ttl" font-size="14">Validator</text>
  <text x="660" y="378" class="sub" font-size="10">&amp; Recovery</text>
  <text x="660" y="396" class="sub" font-size="10">7 modes, sealed</text>
  <text x="660" y="414" class="sub" font-size="10">contract</text>

  <rect class="card"  x="832" y="330" width="156" height="120" rx="10"/>
  <text x="848" y="358" class="ttl" font-size="14">Action Ledger</text>
  <text x="848" y="380" class="sub" font-size="10">idempotent</text>
  <text x="848" y="398" class="sub" font-size="10">side effects</text>
  <text x="848" y="416" class="sub" font-size="10">→ External</text>

  <path class="edge"  d="M236,390 L268,390" marker-end="url(#arrow)"/>
  <path class="edge"  d="M424,390 L456,390" marker-end="url(#arrow)"/>
  <path class="edge"  d="M612,390 L644,390" marker-end="url(#arrow)"/>
  <path class="edge"  d="M800,390 L832,390" marker-end="url(#arrow)"/>

  <!-- Security Extension overlay -->
  <rect class="ovr" x="80" y="470" width="908" height="84" rx="12"/>
  <text x="96" y="492" class="lbl" font-size="11">SECURITY EXTENSION (additive, reuses the SDK above)</text>

  <rect class="obox" x="96"  y="502" width="196" height="40" rx="9"/>
  <text x="112" y="522" class="ttl" font-size="12">Perception /</text>
  <text x="112" y="538" class="sub" font-size="10">Observation provenance</text>

  <rect class="obox" x="320" y="502" width="196" height="40" rx="9"/>
  <text x="336" y="522" class="ttl" font-size="12">Trust Gate</text>
  <text x="336" y="538" class="sub" font-size="10">DOM + 2nd model verify</text>

  <rect class="obox" x="544" y="502" width="196" height="40" rx="9"/>
  <text x="560" y="522" class="ttl" font-size="12">Plan Branch</text>
  <text x="560" y="538" class="sub" font-size="10">→ Review Gate (escalate)</text>

  <rect class="obox" x="768" y="502" width="196" height="40" rx="9"/>
  <text x="784" y="522" class="ttl" font-size="12">Periodic</text>
  <text x="784" y="538" class="sub" font-size="10">Revalidation</text>

  <path class="edge"  d="M292,522 L320,522" marker-end="url(#arrow)"/>
  <path class="edge"  d="M516,522 L544,522" marker-end="url(#arrow)"/>
  <path class="edge"  d="M740,522 L768,522" marker-end="url(#arrow)"/>
  <path class="dash"  d="M884,502 C940,470 880,440 760,420" marker-end="url(#arrowO)"/>
  <text x="892" y="470" class="elabelO">reuses Recovery.assess</text>

  <!-- ===================== TIER 4/5: STORAGE, EXTERNAL, RESUME ===================== -->
  <path class="edge"  d="M540,568 L360,660" marker-end="url(#arrow)"/>
  <path class="edge"  d="M540,568 L720,660" marker-end="url(#arrow)"/>
  <path class="edgeO" d="M540,568 L540,762" marker-end="url(#arrowO)"/>
  <text x="372" y="612" class="elabel">events + state</text>
  <text x="640" y="612" class="elabel">side effects</text>
  <text x="552" y="700" class="elabelO">resume / recovery</text>

  <rect class="card" x="210" y="660" width="300" height="72" rx="12" filter="url(#shadow)"/>
  <text x="226" y="692" class="ttl" font-size="15">Durable Storage</text>
  <text x="226" y="714" class="sub" font-size="11">SQLite, WAL, synchronous FULL</text>
  <text x="226" y="730" class="sub2" font-size="10">integrity-checked on read</text>

  <rect class="card" x="570" y="660" width="300" height="72" rx="12" filter="url(#shadow)"/>
  <text x="586" y="692" class="ttl" font-size="15">External Systems</text>
  <text x="586" y="714" class="sub" font-size="11">GitHub, email, APIs</text>
  <text x="586" y="730" class="sub2" font-size="10">effects recorded by ledger</text>

  <rect class="card" x="390" y="770" width="300" height="56" rx="12" filter="url(#shadow)"/>
  <text x="406" y="794" class="ttl" font-size="14">Resume</text>
  <text x="406" y="815" class="sub" font-size="11">bounded recovery context</text>

  <text x="540" y="958" text-anchor="middle" class="sub2" font-size="10">SDK uses only the Python standard library; the mcp extra adds the server. The Security Extension adds observation provenance, a two-signal trust gate, and scheduled revalidation without changing resume or replay.</text>
</svg>
